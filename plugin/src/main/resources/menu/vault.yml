include: [
  "./lots_items.yml"
]
id: bauc:vault
provider: bauc:vault
title: "<#FF0000>☃ <#FF6600>Хранилище<off_title><b><gray>[<gold>{current_page}<gray>/<gold>{max_page}<gray>]"

slots: 0-44
vault_type: 'vault_and_active' # vault_and_active, only_active, only_vault
always_show_vault_lot: true # всегда показываем vault_lot из lots_items.yml (тогда шалкер не получится осмотреть)

menu-events:
  lots_loaded:
    - layer: 0 set next_page 50
    - layer: 0 set previous_page 48

items:
  back:
    slot: 46
    name: "<#FF0000>[⟲]<#FF6600> Вернуться"
    material: tipped_arrow
    on_click:
      - sound: 'entity.enderman.teleport 1 1'
      - back_or_close: ''
  resell:
    slot: 52
    name: "<#FF0000>[⟲]<#FF6600> Перевыставить предметы"
    lore:
      - "<#FF6600>➥ Нажмите<#FFFFE6>, чтобы перевыставить"
      - ""
      - "<#FFFFE6>Автоматически выставит все"
      - "<#FFFFE6>Ваши предметы заново в Аукцион"
      - "<#FFFFE6>по тем же ценам"
    material: clock
    on_click:
      - resell: ''
      - delay: 1 [research]
  research:
    slot: 49
    name: "<#FF0000>[⟲]<#FF6600> Обновить"
    lore:
      - "<#FF6600>➥ Нажмите<#FFFFE6>, чтобы обновить"
      - ""
      - "<#FFFFE6>Эта кнопка позволяет"
      - "<#FFFFE6>обновить список товаров"
    material: nether_star
    on_click:
      - sound: 'entity.ender_eye.launch 1 1'
      - '[research]'
  rent:
    slot: 53
    name: "<#FF0000>[☃]<#FF6600> Аренда слотов"
    lore:
      - "<#FF6600>➥ Нажмите<#FFFFE6>, чтобы перейти"
      - ""
      - "<#FFFFE6>Здесь можно арендовать,"
      - "<#FFFFE6>дополнительные слоты"
    all_flags: true
    material: crafting_table
    on_click:
      - '[sound] ui.button.click 1 1'
      - open: 'auc_rent:home'

  next_page:
    #slot: 50
    material: spectral_arrow
    on_view: '{has_next_page} == true'
    on_click:
      - sound: 'entity.ender_eye.launch 1 1'
      - next_page: ''

  previous_page:
    #slot: 48
    material: spectral_arrow
    on_view: '{current_page} != 1'
    on_click:
      - sound: 'entity.ender_eye.launch 1 1'
      - previous_page: ''