# если свой предмет
#любой клик - забрать
#
#если чужой
#лкм - купить
#шифт лкм - купить фастом
#
#если шалкер или мешочек
#пкм - осмотреть содержимое
#
#если больше 1 (шалкер и мешочек максимум 1)
#пкм купить количество

item_info_lore: &info
  - ""
  - "<#FF6600> ➥ Нажмите<#FFFFE6>, чтобы <#00FF00>купить"
  - "<st><#FF0000>                         "
  - "<#00FF00>$<#FFFFE6> Ценa:<#00FF00> ${price}"
  - "<#FFFF00>⭐<#FFFFE6> Продавец:<#FFFF00> {seller_name}"
  - "<#FF0066>⟲<#FFFFE6> Истeкaeт:<#FF0066> {expires}"
  - "<st><#FF0000>                         "

vault_lot:
  lore:
    - '<#FF6600> ➥ Нажмите<#FFFFE6>, чтобы <#FFFF00>забрать'
    - "<st><#FF0000>                         "
    - '&r '
    - '<#00FF00>$<#FFFFE6> Цена:<#00FF00>${price}'
    - "<#FF6600>●<#FFFFE6> Статус:{lot_status}"
    - '<#FF0066>⟲<#FFFFE6> Удаление: <#FF0066>{expires}'
    - "<st><#FF0000>                         "
    - '&r '
  on_click: # забрать предмет
    - take_lot: ''

sold:
  name: "<#FF0000>Товар не актуален"
  material: gray_dye
  lore:
    - ""
    - *info
    - '&r '
  all_flags: true
  on_click:
    - '<#FF0000>[✘] Ошибка!<#FFFFE6> Этот товар не актуален!'
    - sound: 'block.note_block.basedrum 1 1'

purchased:
  name: "<#51f542>Товар куплен!"
  material: lime_dye
  lore:
    - ""
    - *info
    - '&r '
  all_flags: true
  on_click:
    - '<#FF0000>[✘] Ошибка!<#FFFFE6> Вы уже купили этот товар!'
    - sound: 'block.note_block.basedrum 1 1'

taken:
  name: "<#51f542>Товар убран!"
  material: lime_dye
  lore:
    - ""
    - *info
    - '&r '
  all_flags: true
  on_click:
    - '<#FF0000>[✘] Ошибка!<#FFFFE6> Вы уже забрали этот товар!'
    - sound: 'block.note_block.basedrum 1 1'

# Когда игрок owner предмета
owned:
  lore:
    - '<#FF6600> ➥ Нажмите<#FFFFE6>, чтобы <#FFFF00>забрать'
    - *info
    - '&r '
  on_click: # забрать предмет
    - take_lot: ''

one:
  lore:
    - '<#FF6600> ➥ Нажмите<#FFFFE6>, чтобы <#00FF00>купить'
    - *info
    - '&r '
  on_left_click: # купить +конфирм
    - open:
        menu: 'bauc:confirm'
        on_accept_command: '[buy_lot]'
  on_shift_left_click: # купить -конфирм
    - buy_lot: ''

container:
  lore:
    - '<#FF6600> ➥ Нажмите<#FFFFE6>, чтобы <#00FF00>купить'
    - *info
    - '&r '
    - '&#E99100↪ &fНажмите &#E99100Пкм'
    - '&#E99100 &fчтобы осмотреть содержимое.'
    - ''
  on_left_click: # купить +конфирм
    - open:
        menu: 'bauc:confirm'
        on_accept_command: '[buy_lot]'
  on_shift_left_click: # купить -конфирм
    - buy_lot: ''
  on_right_click: # открыть шалкер
    - open: 'bauc:container_view'

many:
  lore:
    - '<#FF6600> ➥ Нажмите<#FFFFE6>, чтобы <#00FF00>купить'
    - *info
    - '&r '
  on_left_click: # купить +конфирм
    - open:
        menu: 'bauc:confirm'
        on_accept_command: '[buy_lot]'
  on_shift_left_click: # купить -конфирм
    - buy_lot: ''
  on_right_click: # купить количество
    - open:
        menu: 'bauc:select_count'
        on_accept_command: '[buy_lot] {result_count}'
