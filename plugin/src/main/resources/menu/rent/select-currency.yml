id: auc_rent:select_currency
provider: default
type: chest
size: 45
title: "<#FF0000>☃ <b><#FF6600>Выберите валюту:"
# 1h = 3600000 ms
args:
  eco_price: 1
  eco_price_commas: 1
  pp_price: 1
  eco_limit: 6
  pp_limit: 12
  perm: auc.boost.rent{slot_count}
  pp_price_commas: '{pp_price}'
  squid_only: false

defaults:
  confirm_open: &eco_confirm_open
    menu: auc_rent:confirm
    slot_count: '{slot_count}'
    perm: '{perm}'
    balance_perm: 'vault_eco_balance'
    take_balance_command: 'eco take %player_name% {eco_price}'
    price: '{eco_price}'
    is_pp: false
  confirm_open_pp: &pp_confirm_open
    menu: auc_rent:confirm
    slot_count: '{slot_count}'
    perm: '{perm}'
    balance_perm: 'playerpoints_points'
    take_balance_command: 'p take %player_name% {pp_price}'
    price: '{pp_price}'
    is_pp: true
items:
  d:
    tick_speed: 20
    on_tick: '[update]'
    args:
      expiry: '%bauctionv2_ms_format_%bauctionv2_lp_ttl_{perm}%%'
      expiri_ceil_hours: '{math:ceil(%bauctionv2_lp_ttl_{perm}% / 3600000)}'
    name: "<#FF6600>[☃]<#FFFFE6> Аренда:<#FFFF00> {slot_count} слот<#8C8C8C>/<#FF6600>1 час"
    material: golden_carrot
    amount: '{slot_count}'
    base_lore: &base_lore
      - "<#FF0000><st>                         "
      - "<#FFFF00> $<#FFFFE6> Цена: <#FFFF00>${eco_price_commas}"
      - "<#FF6600> ⛁<#FFFFE6> Баланс: <#FF6600>$%vault_eco_balance_commas%"
      - "<#FF0000><st>                         "
    oneOf:
      - on_view:
          - '{squid_only}'
          - '!has auc.boost.squid'
        lore:
          - *base_lore
          - ""
          - " <#FFFF00>⚠<#FFFFE6> Доступно от:<#FFFF00> Сквид"
        on_click:
          - '<#FF0000>[✘] Ошибка!<#FFFFE6> У Вас нет необходимой<#FFFF00> Привилегии<#FFFFE6>! Не беда, ее можно купить на<#FFFF00> YourServer'
          - sound: entity.creeper.hurt 1 1
          - sound: block.glass.place 1 1
      - on_view: '{expiri_ceil_hours} >= {eco_limit}'
        enchanted: true
        lore:
          - *base_lore
          - ""
          - "<#FFFF00>⚠<#FFFFE6> Аренда уже<#00FF00> Активна<#FFFFE6>!"
          - "<#FF6600>⌛<#FFFFE6> Истечет через:<#FFFF00> {expiry}"
        on_click:
          - '<#FFFF00>[⚠] Упс!<#FFFFE6> Достигнут лимит аренды:<#FFFF00> {eco_limit}<#8C8C8C>/<#FF6600>{eco_limit} час.'
          - sound: block.glass.place 1 1
      - on_view: '{expiri_ceil_hours} > 0'
        enchanted: true
        lore:
          - *base_lore
          - ""
          - "<#FFFF00>⚠<#FFFFE6> Аренда уже<#00FF00> Активна<#FFFFE6>!"
          - "<#FF6600>⌛<#FFFFE6> Истечет через:<#FFFF00> {expiry}"
          - ""
          - "<#FF6600>$<#FFFFE6> После покупки аренда"
          - "<#FF6600>||<#FFFFE6> продлится на<#FFFF00> 1 час"
          - "<#FF6600>||<#FFFFE6> Лимит:<#FFFF00> {expiri_ceil_hours}<#8C8C8C>/<#FF6600>{eco_limit} час."
          - ""
          - "<#FF6600> ➥ Нажмите<#FFFFE6>, чтобы арендовать"
        on_click:
          - open:
              <<+: *eco_confirm_open
              lore:
                - *base_lore
                - ""
                - "<#FFFF00>⚠<#FFFFE6> Аренда уже<#00FF00> Активна<#FFFFE6>!"
                - "<#FF6600>⌛<#FFFFE6> Истечет через:<#FFFF00> {expiry}"
                - ""
                - "<#FF6600>$<#FFFFE6> После покупки аренда"
                - "<#FF6600>||<#FFFFE6> продлится на<#FFFF00> 1 час"
                - "<#FF6600>||<#FFFFE6> Лимит:<#FFFF00> {expiri_ceil_hours}<#8C8C8C>/<#FF6600>{eco_limit} час."
      - lore:
          - *base_lore
          - ""
          - "<#FF6600> ➥ Нажмите<#FFFFE6>, чтобы арендовать"
        on_click:
          open:
            <<+: *eco_confirm_open
            lore: *base_lore

  e:
    tick_speed: 20
    on_tick: '[update]'
    name: "<#FF6600>[☃]<#FFFFE6> Аренда:<#FFFF00> {slot_count} слот<#8C8C8C>/<#FF6600>1 час"
    material: golden_carrot
    amount: '{slot_count}'
    args:
      expiry: '%bauctionv2_ms_format_%bauctionv2_lp_ttl_{perm}%%'
      expiri_ceil_hours: '{math:ceil(%bauctionv2_lp_ttl_{perm}% / 3600000)}'
    base_lore: &base_lore
      - "<#FF0000><st>                         "
      - "<#00FF00> $<#FFFFE6> Цена: <#00FF00>{pp_price_commas} ТК"
      - "<#009900> ⛁<#FFFFE6> Баланс: <#009900>%playerpoints_points% ТК"
      - "<#FF0000><st>                         "
    oneOf:
      - on_view:
          - '{squid_only}'
          - '!has auc.boost.squid'
        lore:
          - *base_lore
          - ""
          - " <#FFFF00>⚠<#FFFFE6> Доступно от:<#FFFF00> Сквид"
        on_click:
          - '<#FF0000>[✘] Ошибка!<#FFFFE6> У Вас нет необходимой<#FFFF00> Привилегии<#FFFFE6>! Не беда, ее можно купить на<#FFFF00> YourServer'
          - sound: entity.creeper.hurt 1 1
          - sound: block.glass.place 1 1
      - on_view: '{expiri_ceil_hours} >= {pp_limit}'
        enchanted: true
        lore:
          - *base_lore
          - ""
          - "<#FFFF00>⚠<#FFFFE6> Аренда уже<#00FF00> Активна<#FFFFE6>!"
          - "<#FF6600>⌛<#FFFFE6> Истечет через:<#FFFF00> {expiry}"
        on_click:
          - '<#FFFF00>[⚠] Упс!<#FFFFE6> Достигнут лимит аренды:<#FFFF00> {pp_limit}<#8C8C8C>/<#FF6600>{pp_limit} час.'
          - sound: block.glass.place 1 1
      - on_view: '{expiri_ceil_hours} > 0'
        enchanted: true
        lore:
          - *base_lore
          - ""
          - "<#FFFF00>⚠<#FFFFE6> Аренда уже<#00FF00> Активна<#FFFFE6>!"
          - "<#FF6600>⌛<#FFFFE6> Истечет через:<#FFFF00> {expiry}"
          - ""
          - "<#FF6600>$<#FFFFE6> После покупки аренда"
          - "<#FF6600>||<#FFFFE6> продлится на<#FFFF00> 1 час"
          - "<#FF6600>||<#FFFFE6> Лимит:<#FFFF00> {expiri_ceil_hours}<#8C8C8C>/<#FF6600>{pp_limit} час."
          - ""
          - "<#FF6600> ➥ Нажмите<#FFFFE6>, чтобы арендовать"
        on_click:
          - open:
              <<+: *pp_confirm_open
              lore:
                - *base_lore
                - ""
                - "<#FFFF00>⚠<#FFFFE6> Аренда уже<#00FF00> Активна<#FFFFE6>!"
                - "<#FF6600>⌛<#FFFFE6> Истечет через:<#FFFF00> {expiry}"
                - ""
                - "<#FF6600>$<#FFFFE6> После покупки аренда"
                - "<#FF6600>||<#FFFFE6> продлится на<#FFFF00> 1 час"
                - "<#FF6600>||<#FFFFE6> Лимит:<#FFFF00> {expiri_ceil_hours}<#8C8C8C>/<#FF6600>{pp_limit} час."
      - lore:
          - *base_lore
          - ""
          - "<#FF6600> ➥ Нажмите<#FFFFE6>, чтобы арендовать"
        on_click:
          open:
            <<+: *pp_confirm_open
            lore: *base_lore
  f:
   #name: "[⟲] Вернуться.."
    name: "<#FF0000>[⟲]<#FF6600> Вернуться.."
    color: "#00FF6600"
    all_flags: true
    material: tipped_arrow
    on_click:
      - back: ''
  b:
    #name: "YourServer"
    name: "<gradient:#FF0000:#FF5000>YourS</gradient><#FF5000>e<gradient:#FF3C00:#FF0000>rver</gradient>"
    material: red_stained_glass_pane
  c:
    #name: "YourServer"
    name: "<gradient:#FF6600:#FF1500>YourS</gradient><#FF1500>e<gradient:#FF2900:#FF6600>rver</gradient>"
    material: orange_stained_glass_pane
animation:
  - tick: 0
    opcodes:
      - set: b 0,1,7,8,9,17,18,26,27,35,36,37,43,44
      - set: c 38,39,40,41,42
      - sound: block.glass.place 1 1
  - tick: 1
    opcodes:
      - set: c 28,29,30,31,32,33,34
      - sound: block.glass.place 1 1
  - tick: 2
    opcodes:
      - set: c 19,20,21,22,23,24,25
      - sound: block.glass.place 1 1
  - tick: 3
    opcodes:
      - set: c 10,11,12,13,14,15,16
      - sound: block.glass.place 1 1
  - tick: 4
    opcodes:
      - set: c 2,3,4,5,6
      - sound: block.glass.place 1 1
  - tick: 5
    opcodes:
      - remove: 30,31,32
      - sound: block.glass.place 1 1
  - tick: 6
    opcodes:
      - remove: 20,22,24
      - set: d 21
      - set: e 23
      - sound: block.glass.place 1 1
  - tick: 7
    opcodes:
      - remove: 12,13,14
      - sound: block.glass.place 1 1
  - tick: 8
    opcodes:
      - set: f 4
      - sound: block.glass.place 1 1
