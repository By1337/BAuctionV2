# wildcard tag pattern
# '*' - any text
# '?' - any symbol


#Давайте удалять мусорные теги
#Аукциону будет проще жить если не надо будет индексировать какое-то говно
cleanup:
  - 'enderman_holdable'
  - 'registry:type'
  - 'btnt:type'
  - 'enchantable/*'
  - 'mineable/*'
  - 'completes_find_tree_tutorial'
  - 'lava_pool_stone_cannot_replace'
  - 'snaps_goat_horn'
  - '*spawnable_on'
  - 'logs_that_burn'
  - '*vibration*'
  - 'has_gravity'
  - 'record'
  - '*signs'
  - 'incorrect_*'
  - '*_ores'
  - '*overworld*'
  - 'azalea_grows_on'
  - 'badlands_terracotta'
  - 'bamboo_plantable_on'
  - '*place_on'
  - '*_logs'
  - 'blocks_wind_charge_explosions'
  - 'frog_prefer_jump_to'
  - 'triggers_*'
  - 'repairs_*'
  - '*replaceable*'


damage_extract:
  damage_10: 10 # целый % дамага <=10
  damage_50: 50 # поломан
  damage_80: 80 # сломан

#+wildcard
tag_rewriter:
  'registry:type:"btnt"': 'btnt'


#+wildcard
tag_appender:
  spawn_egg: '*spawn_egg'
  totem: 'totem_of_undying'
  shulker_box: '*shulker_box'
  default_tnt: 'tnt & !btnt*'
  empty_shulker_box: 'shulker_box & empty_container'
  copper_bulb: '*_copper_bulb'

  category_tools: 'pickaxes|hoes|axes|shovels|shears|flint_and_steel'
  category_weapons: 'swords|spears|trident|mace|bow|crossbow'
  category_armor: 'totem|elytra|*_helmet|*_chestplate|*_leggings|*_boots'
  category_resources:
    - netherite_ingot
    - redstone_ore
    - iron_block
    - diamond_ore
    - glowstone
    - iron_ingot
    - redstone_block
    - gold_ingot
    - lapis_lazuli
    - quartz_block
    - coal_block
    - emerald_block
    - quartz
    - diamond_block
    - gray_dye
    - lapis_block
    - ancient_debris
    - lapis_ore
    - diamond
    - beacon
    - gold_block
    - netherite_block
    - glowstone_dust
    - coal
    - emerald_ore
    - emerald
    - redstone
  category_other_resources:
    - dragon_breath
    - feather
    - experience_bottle
    - chorus_fruit
    - nether_star
    - blaze_rod
    - slime_ball
    - gunpowder
    - leather
    - rabbit_foot
    - flint
    - string
    - conduit
    - bone_meal
    - ender_pearl
    - cactus
    - glistering_melon_slice
    - sugar
    - bone
    - golden_carrot
    - phantom_membrane
    - magma_cream
    - sugar_cane
  potions: '*potion'
  books: '*book'
  category_spawners_and_eggs: 'spawner|spawn_egg'
  category_talismans: 'totem & !has_no_componets'
  category_donat_items: 'totem & !has_no_componets'
  category_brewing:
    - dragon_breath
    - glass_bottle
    - brewing_stand
    - blaze_rod
    - glistering_melon_slice
    - nether_wart
    - ghast_tear
    - gunpowder
    - fermented_spider_eye
    - golden_carrot
    - blaze_powder
    - magma_cream
    - glowstone_dust
    - cauldron
    - sugar
    - redstone
  category_grief:
    - water_bucket
    - tnt
    - redstone_torch
    - lava_bucket
    - piston
    - rail
    - tnt_minecart
    - lever
    - sticky_piston
    - powered_rail
    - flint_and_steel
    - redstone

# паттерны только на материал
search:
