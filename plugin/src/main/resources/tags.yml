# wildcard tag pattern
# '*' - any text
# '?' - any symbol


#Давайте удалять мусорные теги
#Аукциону будет проще жить если не надо будет индексировать какое-то говно
cleanup:
  - 'enderman_holdable'
  - 'registry:type'
  - 'btnt:type'
  - 'enchantable/*'
  - 'mineable/*'
  - 'completes_find_tree_tutorial'
  - 'lava_pool_stone_cannot_replace'
  - 'snaps_goat_horn'
  - '*spawnable_on'
  - 'logs_that_burn'
  - '*vibration*'
  - 'has_gravity'
  - 'record'
  - '*signs'
  - 'incorrect_*'
  - '*_ores'
  - '*overworld*'
  - 'azalea_grows_on'
  - 'badlands_terracotta'
  - 'bamboo_plantable_on'
  - '*place_on'
  - '*_logs'
  - 'blocks_wind_charge_explosions'
  - 'frog_prefer_jump_to'
  - 'triggers_*'
  - 'repairs_*'
  - '*replaceable*'


damage_extract:
  damage_10: 10 # целый % дамага <=10
  damage_50: 50 # поломан
  damage_80: 80 # сломан

#+wildcard
tag_rewriter:
  'registry:type:"btnt"': 'btnt'


#+wildcard
tag_appender:
  '*spawn_egg': 'spawn_egg'
  'totem_of_undying': 'totem'
  '*shulker_box': 'shulker_box'
  'tnt & !btnt*': 'default_tnt'
  'shulker_box & empty_container': 'empty_shulker_box'
  '*_copper_bulb': 'copper_bulb'


# без wildcard паттернов
search:
  ru_RU:
    aliases:
      "незеритовый": 'незер'
      "незеритовые": 'незер'
      "незеритовая": 'незер'
      "всполох": 'блейз'
      "всполоха": 'блейза'
      "эффективность": 'эф'
      "защита": 'з'
      "спавнер": 'сп'
    search:
      "damage_10": 'целый'
      "damage_50": 'поломан'
      "damage_80": 'сломан'
