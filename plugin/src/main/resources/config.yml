# Здесь можно удалить не нужные сортировки или поменять порядок
sorting:
  - newest
  - cheaper
  - oldest
  - expensive

commands:
  # какое меню открывать по /ah
  ah_menu: 'bauc:home'
  # удалите не нужные команды
  disabled_commands: []
    #- sell
    #- search
  # ренейм команд
  commands_renamer:
    ah: ah
    sell: sell
    search: search

ah_search_max_price_perm: 'bauc.search.knyaz' # с какой привилегии будет доступен 'ah search Предмет <макс цена>'
resell_cooldown: '1m'
selling_duration: '1d'

slots:
  # по пермишену выбираем максимальное количество лотов
  # если у игрока есть bauc.default и bauc.vip то слотов у него будет 5 так как bauc.vip даёт 5 слотов против 3 у bauc.default
  select_max:
    - 3 bauc.default
    - 5 bauc.vip
    - 7 bauc.donate
  # добавляемые слоты, у игрока будет (select_max) + все слоты на которые есть пермишен
  add_slots:
    - 1 bauc.add1
    - 2 bauc.add2
    - 3 bauc.add3
    - 4 bauc.add4

$barrier: &auto_removal
  material: red_dye
  tick_speed: 25
  on_tick: '[die]'
visual:
  inv_is_full:
    <<: *auto_removal
    name: '&c<lang:bauctionv2.visual.inv_is_full>'
  not_owner_lot:
    <<: *auto_removal
    name: '&c<lang:bauctionv2.visual.not_owner_lot>'
  added_to_vault:
    <<: *auto_removal
    material: yellow_dye
    name: '&e<lang:bauctionv2.visual.added_to_vault>'
  insufficient_balance:
    <<: *auto_removal
    material: red_dye
    name: '&c<lang:bauctionv2.visual.insufficient_balance>'